  <title>Ledger · Demo</title>
  <meta name="description" content="Demo pública de Ledger, aplicación de finanzas personales. Datos ficticios, sin servidor.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F1EA">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15130E">
  <link rel="canonical" href="https://fireeeh.github.io/portafolio/ledger/">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <script>
    // Tema antes del primer pintado (igual que la app real, con clave propia de la demo).
    (function () {
      try {
        var t = localStorage.getItem('ledger-demo-theme');
        if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>

    <span class="sep" aria-hidden="true">·</span>
    <button type="button" data-action="theme">Tema oscuro</button>
    <button type="button" data-action="reset">Restablecer</button>
